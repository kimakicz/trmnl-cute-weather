---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language:
polling_url: |-
  https://api.open-meteo.com/v1/forecast?latitude={{ latitude }}&longitude={{ longitude }}&current=temperature_2m,weather_code,wind_speed_10m,is_day&timezone=Europe/Prague
  {{ base_url }}/texty.json
polling_headers: ''
polling_body:
id: 484894
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: latitude
  name: Zeměpisná šířka
  field_type: number
  step: 0.01
  default: 48.97
  description: Výchozí hodnota jsou České Budějovice.
- keyname: longitude
  name: Zeměpisná délka
  field_type: number
  step: 0.01
  default: 14.47
- keyname: base_url
  name: Adresa s obrázky a texty
  field_type: url
  placeholder: https://example.com/cute-weather
  description: Veřejná URL složky <code>public/</code> (obsahuje <code>texty.json</code> a <code>img/</code>), bez koncového lomítka.
name: Cute Weather
description: Počasí pro děti s ilustrací
refresh_interval: 60
